    <!-- Fonts (Inter, Plus Jakarta Sans, Cairo) are self-hosted via
         @fontsource — see src/fonts.ts — instead of the Google Fonts CDN.
         That drops fonts.googleapis.com / fonts.gstatic.com as extra
         origins (no DNS/TLS handshake, no dependency-chain hop before the
         font files can even start downloading) and puts every font file
         behind the same long-lived Cache-Control as the rest of the build
         in public/.htaccess. Each @font-face still declares
         font-display: swap, so text keeps painting in the fallback font
         immediately, same as before. -->

    <!-- LocalBusiness / Person / Website JSON-LD is injected dynamically by

         second, static copy here caused duplicate LocalBusiness schema
         blocks with stale data (e.g. removed services) that Google flagged
